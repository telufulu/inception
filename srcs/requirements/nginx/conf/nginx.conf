user nginx;
worker_processes auto;

events {
	# Set the maximum number of simultaneous connections per worker
	worker_connections 1024;
}

http {
	# Load MIME types so static files get the correct Content-Type
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# Send files efficiently and keep connections alive
	sendfile on;
	keepalive_timeout 65;

	server {
		# Listen only on HTTPS port 443
		listen 443 ssl;
		listen [::]:443 ssl;

		# Use the domain required by the subject
		server_name telufulu.42.fr;

		# Use the self-signed certificate generated in the Dockerfile
		ssl_certificate /etc/ssl/certs/inception.crt;
		ssl_certificate_key /etc/ssl/private/inception.key;

		# Allow only TLS versions accepted by the subject
		ssl_protocols TLSv1.2 TLSv1.3;

		# Serve WordPress files from the shared WordPress volume
		root /var/www/html;
		index index.php index.html;

		# Try static files first, then let WordPress handle the route
		location / {
			try_files $uri $uri/ /index.php?$args;
		}

		# Send PHP files to the WordPress PHP-FPM container
		location ~ \.php$ {
			include fastcgi_params;
			fastcgi_pass wordpress:9000;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param SCRIPT_NAME $fastcgi_script_name;
		}
	}
}
