[www]

# Run PHP-FPM workers as the web user available in Alpine
user = nobody
group = nobody

# Listen on all container interfaces so NGINX can reach wordpress:9000
listen = 0.0.0.0:9000

# Keep a small and predictable PHP-FPM process pool for this project
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

# Send worker output to the container logs
catch_workers_output = yes
